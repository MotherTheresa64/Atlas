<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Atlas — event-sourced documents</title>
<style>
  :root{--ink:#14181d;--muted:#5b6670;--line:#e2e6ea;--bg:#f6f7f9;--card:#fff;--accent:#2f5bea;--ok:#177245;--bad:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:16px;letter-spacing:-.01em}
  h1 span{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
  main{max-width:960px;margin:0 auto;padding:18px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
  @media (max-width:820px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;align-self:start}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  textarea,input{padding:9px 11px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:8px;background:#fff;color:inherit;width:100%}
  textarea{min-height:120px;resize:vertical}
  button{font:inherit;font-weight:600;padding:8px 13px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
  button.secondary{background:#fff;color:var(--ink);border-color:var(--line)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .meta{font-size:12.5px;color:var(--muted);margin:0 0 8px}
  .note{margin:10px 0 0;font-size:13px;padding:9px 11px;border-radius:8px}
  .note.ok{background:#f2faf5;color:var(--ok)}
  .note.bad{background:#fdf4f3;color:var(--bad)}
  .history{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .history li button{width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;padding:8px 10px;border-radius:8px;font-size:13px}
  .history li button:hover{background:#f2f4f7}
  .history .v{font-weight:700;font-family:ui-monospace,monospace}
  .replay{margin-top:12px;padding:10px;border:1px dashed var(--line);border-radius:8px;font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap;color:var(--muted)}
  .hint{color:var(--muted);font-size:12.5px;margin:10px 0 0}
</style>
</head>
<body>
<header>
  <h1>Atlas<span>event-sourced documents with optimistic concurrency</span></h1>
</header>
<main>
  <section class="card">
    <label for="content">Current document</label>
    <p id="meta" class="meta">loading…</p>
    <textarea id="content" aria-label="document content"></textarea>
    <div class="row">
      <button id="save" type="button">Save</button>
      <button id="reload" class="secondary" type="button">Reload from server</button>
      <input id="newId" type="text" value="doc-2" aria-label="new document id" style="max-width:160px" />
      <button id="create" class="secondary" type="button">Create</button>
    </div>
    <p id="note" class="note" hidden></p>
    <p class="hint">Saving sends the version you loaded. If someone else changed the document first, the write is rejected instead of overwriting their work.</p>
  </section>
  <section class="card">
    <label>History</label>
    <ul id="history" class="history"></ul>
    <div id="replay" class="replay" hidden></div>
  </section>
</main>
<script>
  const $ = (selector) => document.querySelector(selector);
  let current = null;

  function note(text, kind) {
    const node = $("#note");
    node.textContent = text;
    node.className = "note " + kind;
    node.hidden = false;
  }

  async function load(id) {
    const res = await fetch(`/documents/${encodeURIComponent(id)}`);
    if (!res.ok) { note("No document with that id.", "bad"); return; }
    const data = await res.json();
    current = data.document;
    $("#content").value = current.content;
    $("#meta").textContent = `${current.id} · version ${current.version} · ${data.history.length} events`;
    renderHistory(data.history);
    $("#note").hidden = true;
    $("#replay").hidden = true;
  }

  function renderHistory(history) {
    const list = $("#history");
    list.replaceChildren();
    for (const entry of [...history].reverse()) {
      const item = document.createElement("li");
      const button = document.createElement("button");
      button.type = "button";
      button.innerHTML = `<span class="v">v${entry.version}</span> ${entry.type}`;
      button.addEventListener("click", async () => {
        const res = await fetch(`/documents/${encodeURIComponent(current.id)}/at?version=${entry.version}`);
        const data = await res.json();
        const box = $("#replay");
        box.textContent = `version ${entry.version} (${entry.type}):\n${data.content}`;
        box.hidden = false;
      });
      item.append(button);
      list.append(item);
    }
  }

  async function save() {
    if (!current) return;
    const res = await fetch(`/documents/${encodeURIComponent(current.id)}`, {
      method: "PATCH",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ content: $("#content").value, expectedVersion: current.version }),
    });
    const data = await res.json();
    if (res.status === 409) {
      note(`Conflict: the document is already at version ${data.currentVersion}. Reload to see it, then reapply your edit.`, "bad");
      return;
    }
    if (!res.ok) { note(data.message ?? "Could not save.", "bad"); return; }
    await load(current.id);
    note(`Saved as version ${data.version}.`, "ok");
  }

  async function create() {
    const id = $("#newId").value.trim();
    if (!id) return;
    const res = await fetch("/documents", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ id, content: $("#content").value || "new document" }),
    });
    const data = await res.json();
    if (!res.ok) { note(data.message ?? "Could not create.", "bad"); return; }
    await load(id);
    note(`Created ${id}.`, "ok");
  }

  $("#save").addEventListener("click", save);
  $("#reload").addEventListener("click", () => current && load(current.id));
  $("#create").addEventListener("click", create);

  (async function boot() {
    const res = await fetch("/documents");
    const data = await res.json();
    const first = (data.documents ?? [])[0];
    if (first) await load(first.id);
  })();
</script>
</body>
</html>
